<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>导航按钮 · 翻转自转动效预览</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0a0908; color:#f4f1ea;
    font-family:"SF Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
    min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:56px 20px 72px;
  }
  h1 { font-size:12px; letter-spacing:.24em; font-weight:400; color:#8a857c; margin-bottom:56px; text-align:center; }
  h1 b { color:#d8b36a; font-weight:400; }
  .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:40px; max-width:960px; width:100%; }
  .demo { display:flex; flex-direction:column; align-items:center; gap:18px; padding:44px 24px; border:1px solid #1d1b17; border-radius:12px; background:#0e0c0a; }
  .demo .idx { font-size:10px; letter-spacing:.24em; color:#6d675d; }
  .demo a { font-size:16px; letter-spacing:.18em; color:#e7e2d8; text-decoration:none; padding:6px 0; display:inline-block; perspective:600px; }
  .demo a .ch { display:inline-block; will-change:transform; }
  .demo:hover a .ch { color:#d8b36a; }
  .demo .tip { font-size:10px; letter-spacing:.1em; color:#57524a; }

  /* 1 翻面（X 轴 180° 再回） */
  .d1 a:hover .ch { animation:fl1 .55s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes fl1 { 0%{transform:rotateX(0)} 48%{transform:rotateX(-180deg)} 100%{transform:rotateX(0)} }

  /* 2 垂直翻面（Y 轴 180°） */
  .d2 a { perspective:420px; }
  .d2 a:hover .ch { animation:fl2 .55s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes fl2 { 0%{transform:rotateY(0)} 50%{transform:rotateY(180deg)} 100%{transform:rotateY(0)} }

  /* 3 上翻入场 */
  .d3 a:hover .ch { animation:fl3 .5s cubic-bezier(.22,1,.36,1) both; }
  @keyframes fl3 { 0%{transform:translateY(18px) rotateX(-80deg);opacity:0} 60%{opacity:1} 100%{transform:translateY(0) rotateX(0)} }

  /* 4 自转一圈 */
  .d4 a:hover .ch { animation:fl4 .5s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes fl4 { 0%{transform:rotate(0)} 100%{transform:rotate(360deg)} }

  /* 5 翻转 + 上浮 */
  .d5 a:hover .ch { animation:fl5 .55s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes fl5 { 0%{transform:rotateX(0) translateY(0)} 40%{transform:rotateX(-180deg) translateY(-14px)} 100%{transform:rotateX(0) translateY(0)} }

  /* 6 双圈翻转（Y 轴 540°） */
  .d6 a:hover .ch { animation:fl6 .6s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes fl6 { 0%{transform:rotateY(0)} 55%{transform:rotateY(540deg)} 100%{transform:rotateY(0)} }

  /* 7 逐字错峰翻面 */
  .d7 a:hover .ch { animation:fl7 .5s cubic-bezier(.22,1,.36,1) both; animation-delay:calc(var(--i)*.07s); }
  @keyframes fl7 { 0%{transform:rotateY(90deg);opacity:0} 100%{transform:rotateY(0);opacity:1} }

  /* 8 下翻入场 */
  .d8 a:hover .ch { animation:fl8 .5s cubic-bezier(.22,1,.36,1) both; }
  @keyframes fl8 { 0%{transform:translateY(-18px) rotateX(80deg);opacity:0} 60%{opacity:1} 100%{transform:translateY(0) rotateX(0)} }
</style>
</head>
<body>
  <h1>导航按钮 · 翻转自转动效 <b>预览</b> —— 鼠标悬停查看，回复编号即可应用</h1>
  <div class="grid">
    <div class="demo d1"><span class="idx">01 · 翻面</span><a href="javascript:void(0)"><span class="ch">作</span><span class="ch">品</span><span class="ch">集</span></a><span class="tip">X 轴翻面一次后归位</span></div>
    <div class="demo d2"><span class="idx">02 · 垂直翻面</span><a href="javascript:void(0)"><span class="ch">关</span><span class="ch">于</span><span class="ch">我</span></a><span class="tip">Y 轴翻面（像门翻转）</span></div>
    <div class="demo d3"><span class="idx">03 · 上翻入场</span><a href="javascript:void(0)"><span class="ch">联</span><span class="ch">系</span></a><span class="tip">从上方翻转落入原位</span></div>
    <div class="demo d4"><span class="idx">04 · 自转一圈</span><a href="javascript:void(0)"><span class="ch">作</span><span class="ch">品</span><span class="ch">集</span></a><span class="tip">每个字旋转 360°</span></div>
    <div class="demo d5"><span class="idx">05 · 翻转 + 上浮</span><a href="javascript:void(0)"><span class="ch">关</span><span class="ch">于</span><span class="ch">我</span></a><span class="tip">翻面的同时向上弹起</span></div>
    <div class="demo d6"><span class="idx">06 · 双圈翻转</span><a href="javascript:void(0)"><span class="ch">联</span><span class="ch">系</span></a><span class="tip">Y 轴转一圈半</span></div>
    <div class="demo d7"><span class="idx">07 · 逐字错峰</span><a href="javascript:void(0)"><span class="ch" style="--i:0">作</span><span class="ch" style="--i:1">品</span><span class="ch" style="--i:2">集</span></a><span class="tip">每个字依次翻入</span></div>
    <div class="demo d8"><span class="idx">08 · 下翻入场</span><a href="javascript:void(0)"><span class="ch">关</span><span class="ch">于</span><span class="ch">我</span></a><span class="tip">从下方翻转落入原位</span></div>
  </div>
</body>
</html>
