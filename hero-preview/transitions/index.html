<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>进入作品页 · 动效选择</title>
<style>
  :root {
    --bg: #0a0908;
    --panel: #12100e;
    --line: rgba(244, 241, 234, 0.1);
    --ink: #f4f1ea;
    --ink-dim: rgba(244, 241, 234, 0.45);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Space Grotesk", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    padding: 8vh 6vw 10vh;
  }
  header { margin-bottom: 6vh; }
  header h1 {
    font-size: clamp(26px, 3vw, 44px);
    font-weight: 400;
    letter-spacing: 0.04em;
  }
  header p {
    margin-top: 12px;
    color: var(--ink-dim);
    font-size: 14px;
    letter-spacing: 0.08em;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 28px;
    max-width: 1480px;
    margin: 0 auto;
  }
  .panel {
    position: relative;
    aspect-ratio: 3 / 4;
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    background: var(--panel);
    transition: border-color 0.3s;
  }
  .panel:hover { border-color: rgba(244, 241, 234, 0.35); }
  .panel__tag {
    position: absolute;
    top: 14px; left: 14px;
    z-index: 30;
    font-size: 12px;
    letter-spacing: 0.14em;
    color: var(--ink-dim);
  }
  .panel__tag b { color: var(--ink); font-weight: 500; margin-right: 8px; }

  /* ---- 内容层（作品页示意） ---- */
  .content {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    padding: 6px;
  }
  .content img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(0.85);
  }
  .content__title {
    position: absolute;
    left: 14px; bottom: 12px;
    z-index: 2;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: rgba(244, 241, 234, 0.75);
    background: rgba(10, 9, 8, 0.55);
    padding: 4px 10px;
    border-radius: 99px;
    backdrop-filter: blur(6px);
  }

  /* ---- 开屏层（黑色覆盖） ---- */
  .intro {
    position: absolute;
    inset: 0;
    z-index: 10;
    background: #0a0908;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    will-change: transform, opacity, clip-path;
  }
  .intro::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(60% 60% at 50% 45%, rgba(255, 244, 226, 0.05), transparent 70%);
  }
  .intro__word {
    font-size: clamp(22px, 3.2vw, 34px);
    font-weight: 400;
    letter-spacing: 0.08em;
    color: rgba(244, 241, 234, 0.92);
    transform: translateY(0);
  }
  .intro__hint {
    position: absolute;
    bottom: 16px;
    font-size: 11px;
    letter-spacing: 0.14em;
    color: rgba(244, 241, 234, 0.35);
  }

  /* ============ 五种退出动效 ============ */

  /* 1 向上滑动 */
  .t-slide-up .intro {
    transition: transform 1.1s cubic-bezier(0.76, 0, 0.24, 1), opacity 1.1s cubic-bezier(0.76, 0, 0.24, 1);
  }
  .t-slide-up.play .intro {
    transform: translateY(-102%);
    opacity: 0.6;
  }

  /* 2 遮罩揭开（向上收起） */
  .t-unveil .intro {
    clip-path: inset(0 0 0 0);
    transition: clip-path 1.1s cubic-bezier(0.76, 0, 0.24, 1), opacity 0.9s ease;
  }
  .t-unveil.play .intro {
    clip-path: inset(0 0 100% 0);
    opacity: 0.9;
  }

  /* 3 缩放淡出（镜头拉远） */
  .t-zoom .intro {
    transform: scale(1);
    transition: transform 1s cubic-bezier(0.65, 0, 0.35, 1), opacity 1s ease;
  }
  .t-zoom.play .intro {
    transform: scale(0.92);
    opacity: 0;
  }

  /* 4 3D 翻页（绕底部轴翻开） */
  .t-flip .intro {
    transform-origin: 50% 100%;
    transform: perspective(1200px) rotateX(0deg);
    transition: transform 1.1s cubic-bezier(0.65, 0, 0.35, 1), opacity 0.7s ease;
  }
  .t-flip.play .intro {
    transform: perspective(1200px) rotateX(92deg);
    opacity: 0;
  }

  /* 5 圆形收缩（从中心点收拢消失） */
  .t-circle .intro {
    clip-path: circle(140% at 50% 50%);
    transition: clip-path 1s cubic-bezier(0.76, 0, 0.24, 1);
  }
  .t-circle.play .intro {
    clip-path: circle(0% at 50% 50%);
  }

  /* 重置提示 */
  .hint-reset {
    margin-top: 6vh;
    text-align: center;
    color: var(--ink-dim);
    font-size: 13px;
    letter-spacing: 0.1em;
  }
  .hint-reset b { color: var(--ink); font-weight: 500; }
</style>
</head>
<body>
  <header>
    <h1>选择「进入作品页」的动效</h1>
    <p>点击任一卡片预览 · 播放后自动重置 · 告诉我编号即可应用到网站</p>
  </header>

  <div class="grid">
    <!-- 1 向上滑动 -->
    <div class="panel t-slide-up" data-key="1">
      <div class="panel__tag"><b>01</b>向上滑动</div>
      <div class="content">
        <img src="../docs/works/work-01.jpg" alt="" /><img src="../docs/works/work-05.jpg" alt="" /><img src="../docs/works/work-09.jpg" alt="" />
        <img src="../docs/works/work-13.jpg" alt="" /><img src="../docs/works/work-17.jpg" alt="" /><img src="../docs/works/work-20.jpg" alt="" />
        <img src="../docs/works/work-03.jpg" alt="" /><img src="../docs/works/work-11.jpg" alt="" /><img src="../docs/works/work-15.jpg" alt="" />
        <span class="content__title">作品瀑布流</span>
      </div>
      <div class="intro"><span class="intro__word">Portfolio</span><span class="intro__hint">点击预览</span></div>
    </div>

    <!-- 2 遮罩揭开 -->
    <div class="panel t-unveil" data-key="2">
      <div class="panel__tag"><b>02</b>遮罩揭开</div>
      <div class="content">
        <img src="../docs/works/work-02.jpg" alt="" /><img src="../docs/works/work-06.jpg" alt="" /><img src="../docs/works/work-10.jpg" alt="" />
        <img src="../docs/works/work-14.jpg" alt="" /><img src="../docs/works/work-18.jpg" alt="" /><img src="../docs/works/work-04.jpg" alt="" />
        <img src="../docs/works/work-08.jpg" alt="" /><img src="../docs/works/work-12.jpg" alt="" /><img src="../docs/works/work-16.jpg" alt="" />
        <span class="content__title">作品瀑布流</span>
      </div>
      <div class="intro"><span class="intro__word">Portfolio</span><span class="intro__hint">点击预览</span></div>
    </div>

    <!-- 3 缩放淡出 -->
    <div class="panel t-zoom" data-key="3">
      <div class="panel__tag"><b>03</b>缩放淡出</div>
      <div class="content">
        <img src="../docs/works/work-07.jpg" alt="" /><img src="../docs/works/work-19.jpg" alt="" /><img src="../docs/works/work-01.jpg" alt="" />
        <img src="../docs/works/work-05.jpg" alt="" /><img src="../docs/works/work-09.jpg" alt="" /><img src="../docs/works/work-13.jpg" alt="" />
        <img src="../docs/works/work-17.jpg" alt="" /><img src="../docs/works/work-02.jpg" alt="" /><img src="../docs/works/work-11.jpg" alt="" />
        <span class="content__title">作品瀑布流</span>
      </div>
      <div class="intro"><span class="intro__word">Portfolio</span><span class="intro__hint">点击预览</span></div>
    </div>

    <!-- 4 3D 翻页 -->
    <div class="panel t-flip" data-key="4">
      <div class="panel__tag"><b>04</b>3D 翻页</div>
      <div class="content">
        <img src="../docs/works/work-15.jpg" alt="" /><img src="../docs/works/work-03.jpg" alt="" /><img src="../docs/works/work-06.jpg" alt="" />
        <img src="../docs/works/work-10.jpg" alt="" /><img src="../docs/works/work-14.jpg" alt="" /><img src="../docs/works/work-18.jpg" alt="" />
        <img src="../docs/works/work-04.jpg" alt="" /><img src="../docs/works/work-08.jpg" alt="" /><img src="../docs/works/work-12.jpg" alt="" />
        <span class="content__title">作品瀑布流</span>
      </div>
      <div class="intro"><span class="intro__word">Portfolio</span><span class="intro__hint">点击预览</span></div>
    </div>

    <!-- 5 圆形收缩 -->
    <div class="panel t-circle" data-key="5">
      <div class="panel__tag"><b>05</b>圆形收缩</div>
      <div class="content">
        <img src="../docs/works/work-16.jpg" alt="" /><img src="../docs/works/work-20.jpg" alt="" /><img src="../docs/works/work-09.jpg" alt="" />
        <img src="../docs/works/work-13.jpg" alt="" /><img src="../docs/works/work-17.jpg" alt="" /><img src="../docs/works/work-05.jpg" alt="" />
        <img src="../docs/works/work-01.jpg" alt="" /><img src="../docs/works/work-07.jpg" alt="" /><img src="../docs/works/work-19.jpg" alt="" />
        <span class="content__title">作品瀑布流</span>
      </div>
      <div class="intro"><span class="intro__word">Portfolio</span><span class="intro__hint">点击预览</span></div>
    </div>
  </div>

  <div class="hint-reset">看中哪一个，把编号告诉我，我马上应用到网站</div>

  <script>
    document.querySelectorAll('.panel').forEach((panel) => {
      panel.addEventListener('click', () => {
        if (panel.classList.contains('play')) {
          panel.classList.remove('play')
          return
        }
        panel.classList.add('play')
        setTimeout(() => panel.classList.remove('play'), 1900)
      })
    })
  </script>
</body>
</html>
