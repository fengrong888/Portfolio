# Cloudflare Worker 独立部署配置（后台安全 API）
# 入口固定为 worker/index.js —— 只部署后台 API，绝不构建/部署整个前端网站。
name = "portfolio-admin"
main = "worker/index.js"
compatibility_date = "2026-10-28"

# 部署到 workers.dev（可在 Cloudflare 控制台绑定自定义域名，无需改此文件）
workers_dev = true

# 普通环境变量（部署后也可在 Cloudflare 控制台 → Settings → Variables 里修改）
# 初始部署不设置 Access 变量：接入 Cloudflare Access 前，后台由 ADMIN_PASSWORD 密码会话保护；
# 接入 Access 后，再在此添加（或控制台添加）：
#   CF_ACCESS_TEAM_DOMAIN = "你的 Team Domain（不带 https://）"
#   CF_ACCESS_AUD = "Access 应用 AUD 标签"
[vars]
ALLOWED_ORIGIN = "https://fengrong888.github.io"

# GITHUB_TOKEN 必须作为 Secret 设置，绝不可写进本文件或提交到 Git：
#   npx wrangler secret put GITHUB_TOKEN
# ADMIN_PASSWORD 同样作为 Secret 设置（后台入口密码，仅服务端校验，绝不写进前端）：
#   npx wrangler secret put ADMIN_PASSWORD
# 不设置 ADMIN_PASSWORD 时，后台登录只能走 Cloudflare Access（更推荐）。
